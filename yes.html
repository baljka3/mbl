<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yay! Pookie 💕</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        font-family: "Poppins", sans-serif;
        padding: 15px;
      }

      .card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        padding: 30px 20px;
        border-radius: 24px;
        box-shadow: 0 15px 35px rgba(225, 75, 120, 0.2);
        text-align: center;
        max-width: 420px;
        width: 100%;
        border: 2px solid rgba(255, 255, 255, 0.6);
      }

      .header_text {
        font-size: 1.35rem;
        font-weight: 700;
        color: #d6336c;
        margin-bottom: 12px;
        line-height: 1.3;
      }

      .gif_container img {
        width: 130px;
        height: auto;
        border-radius: 16px;
        margin-bottom: 15px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        text-align: left;
      }

      label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #555;
      }

      input[type="text"],
      input[type="tel"],
      input[type="date"],
      input[type="time"],
      select {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #ffd1dc;
        border-radius: 12px;
        font-family: inherit;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.3s ease;
        background-color: #fff;
      }

      input[type="text"]:focus,
      input[type="tel"]:focus,
      input[type="date"]:focus,
      input[type="time"]:focus,
      select:focus {
        border-color: #ff4b72;
      }

      .submit_btn {
        margin-top: 10px;
        background-color: #ff4b72;
        color: #ffffff;
        padding: 12px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 75, 114, 0.3);
        transition: all 0.2s ease;
      }

      .submit_btn:hover {
        background-color: #e03158;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 75, 114, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="header_text">Мэдээллээ үлдээгээрэй, Нууц нь найдвартай шүү 😉</h1>

      <div class="gif_container">
        <img
          src="https://media0.giphy.com/media/T86i6yDyOYz7J6dPhf/giphy.gif"
          alt="Cute animated illustration"
        />
      </div>

      <div class="form_container">
        <form id="contactForm">
          <label for="name">Нэр:</label>
          <input type="text" id="name" name="name" placeholder="Нэрээ бичээрэй..." required />

          <label for="number">Утасны дугаар:</label>
          <input type="tel" id="number" name="number" placeholder="9911xxxx" required />

          <label for="date">Хэзээ уулзах вэ? 📅</label>
          <input type="date" id="date" name="date" required />

          <label for="time">Хэдэн цагт вэ? ⏰</label>
          <input type="time" id="time" name="time" required />

          <label for="flowers">Цэцэг авмаар байна уу? 🌹</label>
          <select id="flowers" name="flowers">
            <option value="Тэгье, Цэцэгт дуртай 💐">Тэгье, Цэцэгт дуртай 💐</option>
            <option value="Авмаар байна 💖">Авмаар байна 💖</option>
          </select>

          <button type="submit" class="submit_btn">Илгээх 💖</button>
        </form>
      </div>
    </div>

    <script type="text/javascript">
      const PUBLIC_KEY = "YU916hj3sznv1608V";
      const SERVICE_ID = "service_ch2rwtp";
      const TEMPLATE_ID = "template_coixqvc";

      emailjs.init(PUBLIC_KEY);

      document.getElementById("contactForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const btn = document.querySelector(".submit_btn");
        btn.innerText = "Илгээж байна... ⏳";
        btn.disabled = true;

        const dateVal = document.getElementById("date").value;
        const timeVal = document.getElementById("time").value;

        // Мэдээллээ хураангуйлж message рүү оруулна
        const templateParams = {
          name: document.getElementById("name").value,
          email: "baljkadogoo@gmail.com", 
          message: `Утас: ${document.getElementById("number").value}\nОгноо: ${dateVal}\nЦаг: ${timeVal}\nЦэцэг авах уу: ${document.getElementById("flowers").value}`
        };

        emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
          .then(function() {
            alert("Баярлалаа! Мэдээлэл амжилттай очлоо 🥰");
            document.getElementById("contactForm").reset();
            btn.innerText = "Илгээгдлээ! ✨";
          })
          .catch(function(error) {
            alert("Алдаа гарлаа, дахин туршаарай 🥺");
            console.error("EmailJS Error:", error);
            btn.innerText = "Илгээх 💖";
            btn.disabled = false;
          });
      });
    </script>
  </body>
</html>
